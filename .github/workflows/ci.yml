name: CET platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python sources
        run: >-
          python -m py_compile
          server/app.py
          server/platform.py
          server/paddle_ocr.py
          server/__main__.py
          services/paddleocr/app.py
          tools/build_exam_assets.py

      - name: Check browser scripts
        run: |
          node --check public/js/home.js
          node --check public/js/upload.js
          node --check public/js/reader.js
          node --check public/js/practice.js
          if [ -f public/js/review.js ]; then node --check public/js/review.js; fi

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Check patch whitespace
        run: git diff --check
