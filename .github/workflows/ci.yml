name: CET platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ""
      CET_AGENT_URL: ""
      CET_EMBEDDING_URL: ""
    strategy:
      fail-fast: false
      matrix:
        # The whole project targets Python 3.11 (.python-version). 3.12+ is
        # tolerated at runtime but CI and deployment pin the 3.11 series.
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter version
        run: python --version

      - name: Install LangGraph runtime dependencies (no DeepSeek key, no network calls)
        run: python -m pip install -r services/agent/requirements.txt

      - name: Compile all Python entry points
        run: >-
          python -m py_compile
          server/app.py
          server/platform.py
          server/dictionary.py
          server/agent_client.py
          server/chat_stream.py
          server/retrieval.py
          server/paddle_ocr.py
          server/__main__.py
          services/agent/app.py
          services/agent/conversation_memory.py
          services/agent/runtime_tools.py
          services/embeddings/app.py
          services/paddleocr/app.py
          tools/build_exam_assets.py
          tools/run_agent_evals.py
          tools/start_platform.py

      - name: Validate agent eval fixtures
        run: |
          python tools/run_agent_evals.py --validate-only
          python tools/run_agent_evals.py --cases evals/agent_v1_cases.jsonl --validate-only

      - name: Offline Agent contract baseline (no inherited keys or model API)
        run: python tools/run_agent_evals.py --cases evals/agent_v1_cases.jsonl --offline --min-pass-rate 1 --json

      - name: Check browser scripts
        run: |
          node --check public/js/home.js
          node --check public/js/upload.js
          node --check public/js/review.js
          node --check public/js/reader.js
          node --check public/js/agent-chat.js
          node --check public/js/translation.js
          node --check public/js/writing.js
          node --check public/js/learning-store.js
          node --check public/js/learning.js
          node --check public/js/practice.js
          if [ -f public/js/word-lookup.js ]; then node --check public/js/word-lookup.js; fi

      - name: Run unit and regression tests (external services mocked)
        env:
          # Ensure tests never touch the real DeepSeek API.
          DEEPSEEK_API_KEY: ""
        run: python -m unittest discover -s tests -v

      - name: Real LangGraph graphs compile and invoke on 3.11
        run: python -m unittest tests.test_agent_runtime.LangGraphRuntimeSmokeTests -v

      - name: Check patch whitespace
        run: git diff --check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Create isolated reader environment
        run: python -m venv .venv-main

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise reader chat in Chromium (synthetic responses only)
        env:
          DEEPSEEK_API_KEY: ""
          CET_AGENT_URL: ""
        run: npm run test:browser

      - name: Save browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
